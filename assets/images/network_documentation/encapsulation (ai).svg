<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230">
<rect width="820" height="230" rx="28" fill="#0d1d2d"/>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="40" y="86" width="130" height="60" rx="14" fill="#12324a" stroke="#63e6ff"/>
  <text x="105" y="112" fill="#63e6ff" font-size="16">Application</text>
  <text x="105" y="136" fill="#edf6fb" font-size="21" font-weight="700">Data</text>
  <text x="205" y="122" fill="#63e6ff" font-size="32">→</text>

  <rect x="245" y="70" width="140" height="92" rx="14" fill="#16324a" stroke="#63e6ff"/>
  <text x="315" y="95" fill="#63e6ff" font-size="14">Layer 4</text>
  <text x="315" y="122" fill="#edf6fb" font-size="20" font-weight="700">Segment</text>
  <text x="315" y="147" fill="#98a8b8" font-size="15">+ TCP / UDP header</text>
  <text x="420" y="122" fill="#63e6ff" font-size="32">→</text>

  <rect x="455" y="70" width="140" height="92" rx="14" fill="#16324a" stroke="#63e6ff"/>
  <text x="525" y="95" fill="#63e6ff" font-size="14">Layer 3</text>
  <text x="525" y="122" fill="#edf6fb" font-size="20" font-weight="700">Packet</text>
  <text x="525" y="147" fill="#98a8b8" font-size="15">+ IP header</text>
  <text x="630" y="122" fill="#63e6ff" font-size="32">→</text>

  <rect x="665" y="56" width="115" height="120" rx="14" fill="#16324a" stroke="#63e6ff"/>
  <text x="722.5" y="82" fill="#63e6ff" font-size="14">Layer 2</text>
  <text x="722.5" y="106" fill="#edf6fb" font-size="18" font-weight="700">Frame</text>
  <text x="722.5" y="129" fill="#98a8b8" font-size="13">+ Ethernet header</text>
  <text x="722.5" y="147" fill="#98a8b8" font-size="13">+ FCS trailer</text>
  <text x="722.5" y="186" fill="#7fb2ff" font-size="14">Bits on the wire</text>
</g>
</svg>