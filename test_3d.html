<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3D Server Rack Calibration & Preview</title>
  <style>
    body { margin: 0; background: #070a12; color: #fff; font-family: monospace; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    #controls {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(10, 15, 26, 0.85); backdrop-filter: blur(8px);
      padding: 14px 18px; border-radius: 8px; border: 1px solid #1e293b;
      max-width: 440px; font-size: 13px; line-height: 1.5;
    }
    button {
      background: #0ea5e9; color: #fff; border: none; padding: 6px 12px;
      margin: 4px 4px 4px 0; border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    button:hover { background: #38bdf8; }
    #coords { margin-top: 8px; font-size: 11px; color: #94a3b8; }
    #status { color: #38bdf8; font-weight: bold; }
  </style>
  <script>
    window.onerror = function(msg, url, line, col, err) {
      const el = document.getElementById('status');
      if (el) el.innerText = 'JS Error: ' + msg + ' (line ' + line + ') ' + (err ? err.stack : '');
    };
    const origErr = console.error;
    console.error = function(...args) {
      const el = document.getElementById('status');
      if (el) el.innerText = 'Console Err: ' + args.map(a => (a && a.message) || a).join(' ');
      origErr.apply(console, args);
    };
    const origWarn = console.warn;
    console.warn = function(...args) {
      const el = document.getElementById('status');
      if (el && !el.innerText.includes('Err')) el.innerText = 'Warn: ' + args.join(' ');
      origWarn.apply(console, args);
    };
  </script>
  <script>
    // Force standard Image() loader instead of createImageBitmap for headless rendering compatibility
    window.createImageBitmap = undefined;
  </script>
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/vendor/GLTFLoader.js"></script>
  <script src="assets/vendor/OrbitControls.js"></script>
  <script src="assets/vendor/gsap.min.js"></script>
</head>
<body>
  <div id="controls">
    <strong>Server Rack 3D Calibration</strong>
    <div id="status">Starting loader...</div>
    <div>
      <button onclick="goToHero()">1. Hero Angle</button>
      <button onclick="goToScreen()">2. Laptop Screen</button>
      <button onclick="goToKeyboard()">3. Keyboard View</button>
    </div>
    <div id="coords">Camera: [0, 0, 0] | Target: [0, 0, 0]</div>
  </div>
  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const coordsEl = document.getElementById('coords');
    const statusEl = document.getElementById('status');

    statusEl.innerText = 'Initializing Three.js...';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060911);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(-2.2, 2.8, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 2.0, 0);

    // Grid Floor
    const grid = new THREE.GridHelper(20, 40, 0x1e293b, 0x0f172a);
    grid.position.y = -0.01;
    scene.add(grid);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight1.position.set(5, 8, 6);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 1.2);
    dirLight2.position.set(-5, 6, -5);
    scene.add(dirLight2);

    let mixer = null;
    let serverModel = null;

    statusEl.innerText = 'Calling GLTFLoader.load...';

    const loader = new THREE.GLTFLoader();
    statusEl.innerText = 'Starting GLTFLoader...';
    loader.load(
      'assets/models/Server.glb',
      (gltf) => {
        try {
          statusEl.innerText = 'GLTF parsed! Setting up scene...';
          serverModel = gltf.scene;
          
          const box = new THREE.Box3().setFromObject(serverModel);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          
          statusEl.innerText = `SUCCESS! Size: ${size.x.toFixed(1)}x${size.y.toFixed(1)}x${size.z.toFixed(1)}`;
          document.body.setAttribute('data-loaded', 'true');

          controls.target.copy(center);
          scene.add(serverModel);

          if (gltf.animations && gltf.animations.length) {
            mixer = new THREE.AnimationMixer(serverModel);
            const action = mixer.clipAction(gltf.animations[0]);
            action.setLoop(THREE.LoopOnce);
            action.clampWhenFinished = true;
            action.play();
          }
        } catch (e) {
          statusEl.innerText = 'Post-load error: ' + e.message;
        }
      },
      (xhr) => {
        if (xhr.lengthComputable) {
          const percent = ((xhr.loaded / xhr.total) * 100).toFixed(0);
          statusEl.innerText = `Loading: ${percent}% (parsing next...)`;
        } else {
          statusEl.innerText = `Loaded ${(xhr.loaded / 1024).toFixed(0)} KB`;
        }
      },
      (err) => {
        statusEl.innerText = 'Error loading GLB: ' + (err.message || err.toString());
      }
    );

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      controls.update();

      coordsEl.innerText = `Camera: [${camera.position.x.toFixed(2)}, ${camera.position.y.toFixed(2)}, ${camera.position.z.toFixed(2)}] | Target: [${controls.target.x.toFixed(2)}, ${controls.target.y.toFixed(2)}, ${controls.target.z.toFixed(2)}]`;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.goToHero = function() {
      gsap.to(camera.position, { x: -2.2, y: 2.8, z: 3.8, duration: 1.5, ease: 'power2.inOut' });
      gsap.to(controls.target, { x: 0, y: 2.0, z: 0, duration: 1.5, ease: 'power2.inOut' });
    };

    window.goToScreen = function() {
      gsap.to(camera.position, { x: 0.0, y: 2.55, z: 2.2, duration: 1.5, ease: 'power2.inOut' });
      gsap.to(controls.target, { x: 0.0, y: 2.55, z: 1.16, duration: 1.5, ease: 'power2.inOut' });
    };

    window.goToKeyboard = function() {
      gsap.to(camera.position, { x: 0.0, y: 2.7, z: 2.3, duration: 1.5, ease: 'power2.inOut' });
      gsap.to(controls.target, { x: 0.0, y: 1.95, z: 1.6, duration: 1.5, ease: 'power2.inOut' });
    };
  </script>
</body>
</html>
