<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio of Youssef Wael Elfeshawy, Network & Cybersecurity Engineer.">
  <meta name="theme-color" content="#060a11">
  <title>Youssef Wael Elfeshawy — Network & Cybersecurity Engineer</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loader" aria-hidden="true">
    <div class="loader-box">
      <div class="loader-spinner"></div>
      <p>Connecting to server…</p>
      <div class="loader-track"><div id="loader-bar"></div></div>
    </div>
  </div>

  <div id="stage" aria-hidden="true"><canvas id="webgl-canvas"></canvas></div>

  <main>
    <!-- 1. Hero: intro on the left, server on the right -->
    <section id="hero">
      <div class="hero-content">
        <h1>Youssef Wael<br>Elfeshawy</h1>
        <p class="role">Network &amp; cybersecurity engineer</p>
        <div class="skills">
          <h2>Skills</h2>
          <ul>
            <li> Python</li><li>Cybersecurity</li>
            <li>Java</li><li>Cloud</li>
            <li>Linux</li><li>Docker</li>
            <li>Splunk</li><li>Network analysis</li>
          </ul>
        </div>
      </div>
    </section>

    <!-- 2. Laptop screen: one scroll stop per page (Qualifications is a long horizontal timeline) -->
    <section id="screen-stops">
      <div class="stop" data-tab="0"></div>
      <div class="stop stop-long" data-tab="1"></div>
      <div class="stop" data-tab="2"></div>
      <div class="stop" data-tab="3"></div>
    </section>

    <!-- 3. Keyboard / contact -->
    <section id="contact"></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">This portfolio needs JavaScript and WebGL. Contact: youssifelfeshawy@gmail.com</p></noscript>

  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/vendor/GLTFLoader.js"></script>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
