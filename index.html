<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio of Youssef Wael Elfeshawy, Cybersecurity & Network Engineer.">
  <meta name="theme-color" content="#000000">
  <title>Youssef Wael Elfeshawy</title>
  <!-- <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"> -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loader" aria-hidden="true">
    <div class="loader-box">
      <div class="loader-spinner"></div>
      <p>Connecting to server…</p>
      <div class="loader-track"><div id="loader-bar"></div></div>
    </div>
  </div>

  <div id="stage" aria-hidden="true"><canvas id="webgl-canvas"></canvas></div>

  <!-- Mobile Drawer Navigation -->
  <button id="mobile-drawer-toggle" class="mobile-drawer-toggle" aria-label="Open Navigation" aria-expanded="false" aria-controls="mobile-drawer">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>
  <div id="mobile-drawer-backdrop" class="mobile-drawer-backdrop" aria-hidden="true"></div>
  <aside id="mobile-drawer" class="mobile-drawer" aria-label="Mobile Navigation">
    <div class="drawer-header">
      <span class="drawer-title">SCREEN PAGES</span>
      <button id="mobile-drawer-close" class="drawer-close" aria-label="Close Navigation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <nav class="drawer-nav">
      <button type="button" class="drawer-link" data-nav="0">
        <span class="drawer-num">01</span>
        <span class="drawer-label">ABOUT ME</span>
      </button>
      <button type="button" class="drawer-link" data-nav="1">
        <span class="drawer-num">02</span>
        <span class="drawer-label">QUALIFICATIONS</span>
      </button>
      <button type="button" class="drawer-link" data-nav="2">
        <span class="drawer-num">03</span>
        <span class="drawer-label">DOCUMENTATION</span>
      </button>
      <button type="button" class="drawer-link" data-nav="3">
        <span class="drawer-num">04</span>
        <span class="drawer-label">PROJECTS</span>
      </button>
    </nav>
  </aside>

  <main>
    <!-- 1. Hero: intro on the left, server on the right -->
    <section id="hero">
      <div class="hero-content">
        <h1>Youssef Wael<br>Elfeshawy</h1>
        <p class="role">Cybersecurity &amp; network engineer</p>
        <div class="skills">
          <h2>Skills</h2>
          <ul>
            <li>Python</li><li>Cybersecurity</li>
            <li>Java</li><li>Cloud</li>
            <li>Linux</li><li>Docker</li>
            <li>Splunk</li><li>Network analysis</li>
          </ul>
        </div>
      </div>
    </section>

    <!-- 2. Laptop screen: one scroll stop per page (Qualifications and Projects have long scroll distance) -->
    <section id="screen-stops">
      <div class="stop" data-tab="0"></div>
      <div class="stop stop-long" data-tab="1"></div>
      <div class="stop" data-tab="2"></div>
      <div class="stop stop-long" data-tab="3"></div>
    </section>

    <!-- 3. Keyboard / contact -->
    <section id="contact"></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">This portfolio needs JavaScript and WebGL. Contact: youssifelfeshawy@gmail.com</p></noscript>

  <script type="importmap">{ "imports": { "three": "./assets/vendor/three.module.min.js", "three/addons/": "./assets/vendor/" } }</script>
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrollTrigger.min.js"></script>
  <script type="module" src="script.js?v=2.2"></script>
</body>
</html>
